<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nico Nico Pet House｜毛孩寄宿</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f7f1e9; color: #34271f; }
    main { width: min(560px, 100%); padding: clamp(32px, 8vw, 56px) 28px; border: 1px solid #e4d3c0; border-radius: 30px; background: #fffdfa; box-shadow: 0 22px 68px rgba(89, 55, 29, .12); text-align: center; }
    .paw { font-size: 42px; line-height: 1; }
    h1 { margin: 18px 0 10px; font-size: clamp(28px, 8vw, 42px); letter-spacing: .03em; }
    p { margin: 0; color: #756456; line-height: 1.85; }
    small { display: block; margin-top: 26px; color: #a08b79; letter-spacing: .07em; }
  </style>
</head>
<body>
  <main>
    <div class="paw" aria-hidden="true">🐾</div>
    <h1>毛孩寄宿服務</h1>
    <p>網站建置中，敬請期待。</p>
    <small>NICO NICO PET HOUSE</small>
  </main>
</body>
</html>
